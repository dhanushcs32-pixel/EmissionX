[project]
name = "industrial-emissions-module"
version = "0.1.0"
description = "Industrial Emissions Module (Pillar 2) for Carbon Footprint Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "supervision>=0.18.0",
    "ultralytics>=8.0.0",
    "pytest>=8.0.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
