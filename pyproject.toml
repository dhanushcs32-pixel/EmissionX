[project]
name = "emission-x"
version = "0.1.0"
description = "Emission X: Carbon Footprint Intelligence Platform (Pillar 1 Vehicular & Pillar 2 Industrial)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "supervision>=0.18.0",
    "ultralytics>=8.0.0",
    "pytest>=8.0.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "easyocr>=1.7.0",
    "imageio-ffmpeg>=0.5.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
